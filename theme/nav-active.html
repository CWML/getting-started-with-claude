<script>
// Mark the navbar link for the current page's class as active.
// Quarto's own choice is wrong with a shared sidebar (see _quarto.yml).
(function () {
  var page = location.pathname.split("/").pop() || "index.html";
  var target = {
    "part1.html": "part1.html", "part1-reference.html": "part1.html",
    "part2.html": "part2.html", "part2-slides.html": "part2.html", "cheatsheet.html": "part2.html"
  }[page] || "index.html";
  document.querySelectorAll("#navbarCollapse a.nav-link").forEach(function (a) {
    var href = (a.getAttribute("href") || "").split("#")[0].split("/").pop();
    var on = href === target;
    a.classList.toggle("active", on);
    if (on) { a.setAttribute("aria-current", "page"); } else { a.removeAttribute("aria-current"); }
  });
})();
</script>
