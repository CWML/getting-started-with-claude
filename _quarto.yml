project:
  type: website
  output-dir: docs   # committed; GitHub Pages serves main /docs
  # Only render the course pages. materials/ and instructor/ hold R/Python
  # projects (including their own .qmd reports) that participants run locally.
  render:
    - index.qmd
    - part1.qmd
    - part1-reference.qmd
    - part2.qmd
    - part2-slides.qmd
    - cheatsheet.qmd
  resources:
    - "/.nojekyll"
    - materials/part1-kits/*
  post-render: scripts/build_downloads.py

website:
  title: "Getting Started with Claude"
  description: "Two hands-on library classes: getting started with Claude, and analyzing research data with Claude Code."
  site-url: "https://cwml.github.io/getting-started-with-claude/"
  repo-url: "https://github.com/CWML/getting-started-with-claude"
  repo-actions: [issue]
  search: true
  page-navigation: true
  navbar:
    collapse-below: xxl
    left:
      - text: "Cushing/Whitney Medical Library"
        href: https://library.medicine.yale.edu/
      - href: index.qmd
        text: Home & setup
      - href: part1.qmd
        text: "Getting started with Claude"
      - href: part2.qmd
        text: "Analyzing research data"
    right:
      - text: "Feedback"
        icon: envelope
        href: "mailto:justin.demayo@yale.edu?subject=Claude%20classes%20feedback"
      - icon: github
        href: "https://github.com/CWML/getting-started-with-claude"
        aria-label: "Course materials on GitHub"
  # One shared sidebar on every page. Quarto marks the first navbar link whose
  # page is anywhere in the sidebar as active, which would always be Home, so
  # theme/nav-active.html resets the active navbar link for each page.
  sidebar:
    style: docked
    contents:
      - href: index.qmd
        text: Home
      - section: "Getting started with Claude"
        contents:
          - href: part1.qmd
            text: Class page
          - href: part1-reference.qmd
            text: Quick reference
          - href: index.html#setup-part1
            text: Setup
      - section: "Analyzing research data with Claude Code"
        contents:
          - href: part2.qmd
            text: Class page
          - href: part2-slides.qmd
            text: Slides
          - href: cheatsheet.qmd
            text: Cheat sheet
          - href: index.html#setup-part2
            text: Setup
      - href: index.html#access
        text: Access and alternatives
      - href: index.html#links
        text: Recommended links
  page-footer:
    left: "Cushing/Whitney Medical Library · Yale School of Medicine"
    center: "Questions or feedback? Email [justin.demayo@yale.edu](mailto:justin.demayo@yale.edu?subject=Claude%20classes%20feedback) · Copyright © 2026 Yale University · All Rights Reserved · [Accessibility at Yale](https://usability.yale.edu/digital-accessibility/accessibility-at-yale) · [Privacy Policy](https://privacy.yale.edu/resources/privacy-statement)"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: [cosmo, theme/cwml.scss]
      dark: [cosmo, theme/cwml.scss, theme/cwml-dark.scss]
    respect-user-color-scheme: true
    toc: true
    toc-title: "On this page"
    code-copy: true
    code-overflow: wrap
    include-before-body: theme/skip-link.html
    include-after-body: theme/nav-active.html
